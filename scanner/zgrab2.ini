; zgrab2.ini — "multiple" module config.
; Each [name] block is a protocol probe. zgrab2 routes a target to the block(s)
; whose `port=` matches, or you can run all. Output is one JSON object per host
; containing whichever probes ran.

; --- TLS: full cert chain, version, cipher, SANs. The cert SHA256 is your
; per-certificate fingerprint; JARM (separate stage) is the server fingerprint. ---
[tls]
name=tls
port=443
trigger=tls

; common alternate TLS ports
[tls8443]
name=tls8443
port=8443
trigger=tls8443

; --- SSH: server banner, host-key type, and host-key SHA256 fingerprint,
; plus negotiated kex/cipher algorithms. ---
[ssh]
name=ssh
port=22
trigger=ssh

; --- HTTP: status, server header, title; follows up to 3 redirects. ---
[http]
name=http
port=80
trigger=http
endpoint=/
max-redirects=3

[https]
name=https
port=443
trigger=https
endpoint=/
max-redirects=3
