# inventory.example.yaml — copy to inventory.yaml and edit.
# Order matters: the first VM gets shard 0, second gets shard 1, etc.
# Make sure you can `ssh user@host` with a key (no password prompt).
vms:
  - { user: scanner, host: 203.0.113.10 }   # -> shard 0/3
  - { user: scanner, host: 203.0.113.11 }   # -> shard 1/3
  - { user: scanner, host: 203.0.113.12 }   # -> shard 2/3
